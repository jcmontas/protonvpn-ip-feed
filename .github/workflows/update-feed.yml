
name: Update ProtonVPN IPv4 Feed

on:
  schedule:
    - cron: "0 7 * * *"  # 03:00 Dominican Republic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protonvpn-ip-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Generate ProtonVPN IPv4 feed
        run: python scripts/update_feed.py

      - name: Publish updated feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add protonvpn-ipv4.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update ProtonVPN IPv4 feed"

            AUTH_HEADER=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)

            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push
          else
            echo "No changes in ProtonVPN prefixes."
          fi
